<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Ice Cream</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        svg {
            width: 250px;
            height: auto;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Ice Cream Colors (drawn first, to be under the outline) -->
    <!-- Red part -->
    <path d="M 40.5,180.5 C 35,120 50,45 100,30 C 90,80 80,130 80,180.5 Z" fill="#E53935"/>
    <!-- Yellow part -->
    <path d="M 80,180.5 C 80,130 90,80 100,30 C 110,80 120,130 115,180.5 Z" fill="#FDD835"/>
    <!-- Green part -->
    <path d="M 115,180.5 C 120,130 125,90 135,70 C 130,110 130,150 140,180.5 Z" fill="#7CB342"/>
    <!-- Blue part -->
    <path d="M 140,180.5 C 150,150 155,110 135,70 C 165,80 175,140 159.5,180.5 Z" fill="#1E88E5"/>

    <!-- Cone -->
    <path d="M 40,180 L 160,180 L 100,280 Z" fill="#F9A825" stroke="#333" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Ice Cream Outline -->
    <path d="M 40.5,180.5 C 35,120 50,45 100,30 C 165,80 175,140 159.5,180.5" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Internal lines of the ice cream -->
    <path d="M 80,180.5 C 80,130 90,80 100,30" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 115,180.5 C 120,130 125,90 135,70" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 140,180.5 C 150,150 155,110 135,70" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
